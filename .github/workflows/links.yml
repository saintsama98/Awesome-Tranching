name: links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check external links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-retries 3 --timeout 30 --accept 200..=299,403,429 './**/*.md'
          fail: true
